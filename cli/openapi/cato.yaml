# GENERATED FILE — do not edit by hand.
# Source : GET https://crm.prudai.com/rest/open-api/core (live CATO instance)
# Script : bun run cli/scripts/generate-openapi.ts
# Regenerate after any CRM schema change; do not patch this file directly.
openapi: 3.1.1
info:
  title: "CATO — PrudAI CRM"
  version: v0.1
  description: |-
    The surface of PrudAI's Twenty CRM instance ("CATO").

    Generated by cli/scripts/generate-openapi.ts. The core objects are taken from
    the live CATO document (GET /rest/open-api/core), so their field names, enum
    values and composite shapes are the real ones and cannot drift. The
    /marketing/* routes are a custom controller in our Twenty fork and do not
    appear in that document; they are described in cli/scripts/marketing-paths.ts
    and must be kept in step with the controllers by hand.

    WHAT IS IN HERE
      * people, companies, opportunities, notes — list, get, create, update, delete;
      * the full /marketing/* module: campaigns, company targets, contact research,
        contact selection candidates, members, review queue, assets and sending.

    WHAT IS LEFT OUT
      * the /batch/*, /merge, /duplicates and /groupBy routes;
      * every other object in the workspace, including messages,
        messageParticipants, connectedAccounts and calendarEvents — those carry
        e-mail content and mailbox metadata;
      * the metadata API (/rest/metadata/*) and the GraphQL endpoints.

    SENDING MAIL
      Nothing here sends mail on its own. A campaign is created disabled with
      generation off and no members, and CATO refuses to dispatch a touchpoint
      whose approvalState is not 'approved'. Approving is a deliberate human step;
      there is no auto-approve route.

    AUTHENTICATION
      Bearer token in the Authorization header — a Twenty API key, or a user
      session token.

      IMPORTANT — read this before issuing a key. Every API key must carry a role,
      and a role is only attachable to an API key when canBeAssignedToApiKeys is
      true. Today the ONLY such role in this workspace is Admin, which grants read,
      write, delete and all settings — and since server-commit 3c570e37 it also
      grants access to the marketing module. A key issued today therefore cannot be
      read-only, and can approve and send campaign mail. Creating a restricted role
      first is the fix. Verify with: cato auth roles
servers:
  - url: "https://crm.prudai.com/rest/"
    description: CATO production
security:
  - bearerAuth: []
