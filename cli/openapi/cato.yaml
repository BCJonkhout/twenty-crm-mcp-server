components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Twenty API key. See `cato auth roles` for what a key can actually do."
  parameters:
    depth:
      name: depth
      in: query
      description: |-
        Determines the level of nested related objects to include in the response.
            - 0: Primary object only
            - 1: Primary object + direct relations
      required: false
      schema:
        type: integer
        enum:
          - 0
          - 1
        default: 1
    endingBefore:
      name: ending_before
      in: query
      description: "Returns objects ending before a specific cursor. You can find cursors in **startCursor** and **endCursor** in **pageInfo** in response data"
      required: false
      schema:
        type: string
    filter:
      name: filter
      in: query
      description: |-
        Format: field[COMPARATOR]:value,field2[COMPARATOR]:value2.
            For like/ilike, use % as a wildcard (e.g. %value% for substring match).
            Refer to the filter section at the top of the page for more details.
      required: false
      schema:
        type: string
      examples:
        simple:
          value: "createdAt[gte]:\"2023-01-01\""
          description: A simple filter param
        simpleNested:
          value: "emails.primaryEmail[eq]:foo99@example.com"
          description: A simple composite type filter param
        complex:
          value: "or(createdAt[gte]:\"2024-01-01\",createdAt[lte]:\"2023-01-01\",not(id[is]:NULL))"
          description: A more complex filter param
        like:
          value: "name[like]:\"%value%\""
          description: Pattern matching
    idPath:
      name: id
      in: path
      description: Object id.
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      description: Limits the number of objects returned.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 60
    orderBy:
      name: order_by
      in: query
      description: |-
        Format: **field_name_1,field_name_2[DIRECTION_2]
            Refer to the filter section at the top of the page for more details.
      required: false
      schema:
        type: string
      examples:
        simple:
          value: createdAt
          summary: A simple order_by param
        complex:
          value: "id[AscNullsFirst],createdAt[DescNullsLast]"
          summary: A more complex order_by param
    softDelete:
      name: soft_delete
      in: query
